W0:`## Coherence = tư duy logic (tr.244)
- Giám khảo tự hỏi: “Tôi có cần đọc lại câu trước để hiểu câu này không? Bài có đi đến kết luận rõ ràng không?”
- Yếu tố 1 – Clear Progression: ý đi như mũi tên thẳng tới đích. Lỗi “vòng vèo”: nêu ý rồi nhảy sang ý khác, hoặc lặp lại ý cũ bằng từ khác. Công thức tuyến tính: A → B → C → Kết quả. Ví dụ tắc đường: dân số tăng nhanh → xe cá nhân tăng vọt → hạ tầng không mở rộng kịp → quá tải giờ cao điểm.
- Yếu tố 2 – “Một đoạn – Một linh hồn”: Band 7.0 yêu cầu “Presents a clear central topic within each paragraph”. Dùng P.I.E cho mọi Body: P–Point (câu chủ đề, nêu thẳng) · I–Illustrate/Explain (vì sao, như thế nào) · E–Example/Effect (ví dụ hoặc hệ quả để chốt ý).
## Cohesion = “chất keo” ngôn ngữ (tr.245)
- Có nhiều từ nối nhưng ý lộn xộn vẫn thiếu Coherence. Liên kết phải phục vụ mạch lạc.
## 1. Phép Nối – Conjunctions (tr.245–246)
|Quan hệ|Band 5–6|Band 7+
|Bổ sung|Also, Besides, In addition|Furthermore, Moreover · Not only… but… also… · …, as well as…
|Nguyên nhân – Kết quả|So, Because, Therefore|Consequently, Hence, Thus · …, thereby + V-ing (Prices increased, thereby reducing demand.)
|Tương phản|But, However, On the other hand|Conversely · In stark contrast · While / Whereas (nối 2 mệnh đề trong 1 câu)
|Ví dụ|For example, For instance|To illustrate · A clear instance of this is… · Namely · Specifically
## 2. Phép Quy Chiếu – Reference: “This + Summary Noun”
- Không để “This” đứng một mình. 5.0: The government raised taxes. This made people angry. → 6.0: …This action made… → 7.0+: The government decided to raise taxes significantly. This policy has sparked public outrage.
## 3. Phép Thế – Substitution
- The former / The latter: …solar energy and fossil fuels. While the latter is cheaper, the former is much more eco-friendly.
- Such + Noun: Many employees are forced to work overtime without pay. Such exploitation should be severely punished.
## 4. Phép Tỉnh Lược – Ellipsis
- Rút gọn mệnh đề quan hệ: The money spent on the project was wasted.
- Bỏ động từ lặp: In 1990, the price was $5; in 2000, $10.
## 5. Liên kết từ vựng – Lexical Cohesion
- Synonyms: Children → Youngsters / The younger generation / These adolescents. Word families: Mathematics is crucial… Being mathematically literate helps…`,

## II. 3 hướng tiếp cận (tr.248–249)
|Hướng|Thân bài|Khi nào dùng
|Totally Agree|Body 1 và 2: mỗi đoạn 1 lý do Đồng ý (cùng chiều)|Ý kiến đề rất đúng hoặc bạn nhiều ý ủng hộ
|Totally Disagree|Body 1 và 2: mỗi đoạn 1 lý do Phản đối (cùng chiều)|Ý kiến quá vô lý hoặc dễ phản bác

- Bước 1 (2 phút) – phân tích đề: Topic + Controlling words tuyệt đối (Best, Only, Always, All); có các từ này thì hướng phản đối hoặc Balanced thường dễ viết hơn.
- Bước 2 (5 phút) – chọn phe: viết theo hướng bạn có nhiều từ vựng nhất, không nhất thiết là suy nghĩ thật; chọn 2 luận điểm mạnh nhất.
- Bước 3 – viết: Mở bài phải có Thesis rõ ràng (thiếu là mất Task Response nghiêm trọng, có thể xuống Band 5.0); Topic Sentence mỗi đoạn liên kết trực tiếp với Thesis.
## V. Từ vựng (tr.250–253)
- Thesis (Balanced): I completely agree/disagree with this view. · While I accept that…, I would argue that… · I am of the opinion that…
- Body 1: On the one hand,… · Admittedly,… / It is true that… · There are valid reasons why some people support…
- Body 2: On the other hand,… · However, I believe that… · Nevertheless, a stronger argument can be made that…
- Kết: In conclusion, although… · To sum up, it is my firm belief that…
- Thesis một phe: I completely/totally/strongly disagree with this view. · I am firmly of the opinion that… · It is my conviction that… · I wholeheartedly support/oppose the idea that… · The argument that [A] is the best solution is flawed.
- Luận điểm 1: The primary reason for my position is that… · The most compelling argument against/for this is… · First and foremost,…
- Luận điểm 2: Another significant drawback/benefit is that… · Furthermore, it is important to recognize that… · A further justification for my view is… · Not only that, but…
- Chê phe đối lập: counter-productive (phản tác dụng) · short-sighted (thiển cận) · flawed (có lỗ hổng) · futile (vô ích) · fail to address the root causes · erroneous (sai lầm, trang trọng hơn wrong).

- Kết mạnh: In conclusion, I remain firmly convinced that… · For the reasons mentioned above, I strongly believe that… · To sum up, it is evident that…
## VI. 4 lỗi thường gặp (tr.253–254)
- Không có quan điểm rõ ràng → Task Response không quá 5.0. Sửa: bắt buộc có “I agree/disagree/believe” ở mở bài.
- Mâu thuẫn: mở bài “hoàn toàn đồng ý” nhưng một đoạn ủng hộ, một đoạn phản đối → mất Coherence. Sửa: Totally Agree thì cả 2 đoạn cùng bảo vệ; muốn 2 chiều thì chọn Balanced và dùng However.

- Thân bài thiếu phát triển ý (chỉ liệt kê). Sửa: công thức P.E.E (Point – Explain – Example).
## VII. Phân tích bài mẫu: four weeks of holidays (tr.254–257)
- TR: Band 6.0 viết A→B hời hợt (“nghỉ 4 tuần giúp hết mệt, làm việc tốt hơn”). Band 7.0 phải extend và lật vấn đề: vì sao nghỉ cuối tuần không đủ? Góc nhìn công ty? Ý 1: áp lực cao, kỳ nghỉ dài giúp “ngắt kết nối”. Ý 2: dù gián đoạn tạm thời (temporary disruption), công ty giữ chân được nhân viên giỏi (staff retention).

- GRA (“frequent error-free sentences”): Relative clause: Employees who are given ample time to rest are generally more focused and creative. · Concession: While granting a month-long absence could disrupt daily operations, the long-term benefits far outweigh this drawback. · Participle: Feeling valued and well-rested, staff members are more likely to develop strong loyalty to their company.
- Bài mẫu: Intro (paraphrase + I completely agree + 2 lý do) → Body 1 lợi ích cá nhân (The primary reason…; Referencing This constant pressure; Substitution a month-long break) → Body 2 lợi ích doanh nghiệp (While it is true…; this short-term inconvenience) → Conclusion (In conclusion, I strongly support… Although it may pose minor challenges…).`,
W2:`## Nhận dạng và hướng (tr.258–259)
- Đề cho 2 quan điểm trái chiều, yêu cầu: Discuss both views and give your own opinion. Bắt buộc Balanced View ở thân bài và Clear Opinion ở kết luận. Chỉ viết 1 phe → Task Response bị giới hạn ở Band 4.0–5.0.
## Cấu trúc 4 đoạn (tr.259–260)
- Intro: paraphrase 2 luồng ý kiến (Some people think A, while others believe B) + Thesis: sẽ thảo luận cả hai và nêu quan điểm.
- Body 1 – phe bạn KHÔNG đồng ý (yếu hơn): Topic Sentence khách quan, “On the one hand, some people argue that…”; giữ trung lập, chưa vội phản bác.
- Body 2 – phe bạn ĐỒNG Ý: “On the other hand, I side with those who believe that…”; giải thích vì sao hợp lý hơn; có thể so sánh để thấy phe B vượt trội. “Save the best for last”.
- Conclusion: tóm tắt + khẳng định lại quan điểm (although View A has some merits, I firmly believe View B is better).
- Topic Sentence Body 1 không dùng “I”; Body 1 dùng ngôi 3 (They, Some people, Proponents), Body 2 mới có thể dùng I.
## Quy trình (tr.260–261)
- Bước 1: xác định View A, View B; “Discuss both” = 2 đoạn, “Give opinion” = chốt phe. Bước 2: chọn phe dễ viết hơn đặt vào Body 2; tìm 2 lý do cho mỗi view. Bước 3: viết, chú ý cohesive devices để chuyển mượt giữa hai luồng ý kiến.
## Từ vựng (tr.261)
- Ý người khác: Some people argue/believe/claim that… · It is often argued that… · Proponents/Advocates of [A] suggest that… · Opponents of this view point out that… · A common belief is that…
- Ý mình: However, I side with those who believe that… · Personally, I share the view that… · In contrast, my own view is that… · Despite the arguments above, I am convinced that…
- Kết: In conclusion, while [A] has some benefits, I believe [B] is more significant. · To sum up, although it is understandable why some support [A], it is my firm conviction that [B] is the better approach.
## 4 lỗi (tr.261–262)
- Chỉ thảo luận một phe (TR tối đa 5.0) · Không đưa ý kiến (cần “I believe/I think” ở Mở bài hoặc Kết bài, tốt nhất cả hai) · Lạm dụng “I” trong đoạn khách quan (Body 1 dùng They believe / It is believed) · Phân bố dung lượng không đều (hai Body tương đương, Body 2 có thể dài hơn chút).
## Bài mẫu nước ngọt (tr.262–265)
- TR: chọn ít ý (1–2 ý/đoạn) nhưng extend và support: Tại sao? Hậu quả gì? View 1: nước là nhu cầu cơ bản, nông nghiệp phụ thuộc, hạn chế thì mất mùa. View 2: nước ngọt là tài nguyên hữu hạn, nhà máy khai thác quá mức → áp quotas / taxes.
- CC (Referencing + Substitution): Many industries consume massive amounts of water without recycling it. This excessive consumption is leading to severe water shortages, making such government interventions absolutely necessary.
- LR: use water as they like → have free access to water / consume water freely · control toughly → impose strict regulations on · not enough water → water scarcity / shortages · important → a vital resource.
- GRA: Farmers, relying heavily on irrigation systems, might face lower crop yields… · If fresh water is consumed without any restrictions, global water shortages will become unavoidable. · Ellipsis: …while others advocate for strict government control, a view that I strongly support.`,
W3:`## Nhận dạng (tr.266)
- Đề có hai dấu hỏi (?) tách hai yêu cầu. Ví dụ: Most people want to be famous nowadays. 1. Why does this happen? 2. Do you think this is a good thing?
## 3 biến thể (tr.266–267)
- Cause + Opinion (phổ biến nhất): Body 1 hoàn toàn về lý do; Body 2 biện luận tích cực/tiêu cực.
- Cause + Solution: Body 1 nguyên nhân gốc rễ; Body 2 giải pháp tương ứng với các nguyên nhân đã nêu.
- Direct Specific Questions (khó nhất): hai khía cạnh khác hẳn nhau. Ví dụ Success is often measured by wealth: Body 1 trả lời về tiền bạc; Body 2 về các yếu tố khác tạo nên thành công.
## Cấu trúc 4 đoạn (tr.267)
- Intro: paraphrase + Thesis (sẽ trả lời cả hai câu hỏi hoặc tóm nhanh câu trả lời). Body 1 trả lời trọn vẹn Q1 (Topic Sentence trả lời thẳng Q1). Body 2 trả lời trọn vẹn Q2. Conclusion nhắc lại câu trả lời cho Q1 và Q2.
## Quy trình (tr.268)
- Bước 1 (2 phút): gạch từ để hỏi. Why/Reason → nguyên nhân · How/What can be done → giải pháp · Is it good or bad → đánh giá (Evaluation).
- Bước 2 (5 phút): mô hình 2-2 (khuyên dùng): 2 ý cho Q1 và 2 ý cho Q2, các ý liên quan logic nếu có thể.
- Bước 3: dùng signposting. Body 1: Regarding the first question,… / The primary reason for… is… Body 2: Turning to the second question,… / However, as for the impact of this trend,…
## Từ vựng (tr.268–269)
- Q1: Regarding the first question,… · With respect to the reasons why [Topic],… · There are several reasons why [Topic] is happening. · The primary cause of this phenomenon is…
- Q2: Turning to the second question,… · As for the question of whether this is positive or negative,… · Regarding the potential solutions to this problem,… · Conversely, I believe that…
- Nguyên nhân: This trend stems from… · This can be attributed to… · The main driver of this development is… · One significant contributing factor is…
- Đánh giá: I am inclined to believe that this is a largely detrimental development. · While there are some benefits, the drawbacks are far more significant. · On the whole, I view this as a progressive step.
## 4 lỗi (tr.269–270)
- Phân bổ dung lượng không cân (hai Body tương đương) · Gộp câu trả lời trong một đoạn (One paragraph, one purpose) · Thiếu liên kết giữa hai phần (dùng Turning to the second question…) · Lạc đề Q2 (đề hỏi đánh giá mà lại viết giải pháp).
## Bài mẫu unpaid work (tr.270–273)
- Đề: all young adults required to do unpaid work helping the community; drawbacks greater than benefits?
- TR: 6.0 chỉ “làm không lương mất thời gian” rồi chuyển ý. 7.0 trả lời: tại sao mất thời gian, hậu quả gì (xao nhãng → ảnh hưởng điểm số hoặc tương lai nghề nghiệp). Benefits: kỹ năng thực tế cho cá nhân; nhân lực miễn phí cho tổ chức từ thiện.
- CC: Young people have to work for free. This unpaid obligation can make them feel stressed.
- LR: unpaid work → unpaid community service / voluntary work · waste time → take up valuable time / disrupt their studies · good for community → provide practical support / benefit society · young adults → the younger generation / young individuals.
- GRA: Young people, facing heavy study loads, might find this policy stressful. · Not only does this policy help the community, but it also teaches young people valuable skills. (đảo trợ động từ does lên trước chủ ngữ) · Some people support this mandatory service, while others oppose it.
- Bài mẫu của sách có 3 đoạn thân: drawbacks → benefits cho cá nhân → benefits cho cộng đồng.`,
W4:`## Mục tiêu Band 7.0+ (tr.274)
- TA: nêu 2–3 đặc điểm bao quát nhất trong Overview, chọn số liệu tiêu biểu, không liệt kê máy móc. CC: phân nhóm logic (theo đối tượng, thời gian hoặc xu hướng). LR: tránh lặp “number”, “percentage”. GRA: câu phức, so sánh, mệnh đề rút gọn, nominalization.
## Phân loại (tr.274–275)
- Time-series (động): tả “hành trình” dữ liệu: xu hướng, điểm đầu/cuối, cao/thấp nhất.
- Non-time-series (tĩnh): so sánh thứ hạng, chênh lệch, tương đồng; tuyệt đối KHÔNG dùng từ xu hướng (increase, decrease, rise, fall, trend).
## 4 bước (tr.275–276)
- 1) Đọc Title, trục, Legend/Key, Time frame. 2) Key Features cho Overview: xu hướng tổng thể, peak/low/đột biến, so sánh bao quát. 3) Chia 2 Body theo đối tượng, thời gian hoặc xu hướng. 4) Chỉ chọn số liệu: đầu, cuối, cao nhất, thấp nhất, thay đổi đáng kể.
## Ngôn ngữ xu hướng (tr.276–277)
|Mức độ|Động từ|Danh từ / cụm
|Tăng nhẹ|to creep up · to experience a marginal growth|a negligible rise · a gradual upward trend
|Tăng mạnh|to escalate · to witness an exponential surge · to skyrocket (mạnh hơn soar)|a steep ascent · a meteoric rise · a substantial increment
|Giảm nhẹ|to dwindle · to shrink|a moderate contraction · a steady downward trajectory
|Giảm mạnh|to evaporate · to slump|a precipitous fall · a drastic downturn
|Đỉnh / đáy|to peak at / reach a zenith of · to bottom out at / hit a low of|reached a peak of… · fell to a trough of…
|Ổn định / dao động|to plateau · to stagnate · to oscillate|a period of stability · erratic behaviors · remained static
- Grammar tip: The price saw/witnessed/underwent a significant increase. / There was a significant increase in the price.
## So sánh và số liệu (tr.277–278)
- Vượt: surpass / overtake / outstrip · eclipse · the gap / the disparity widened/narrowed.
- Gấp bội: double / twofold · triple / threefold · quadruple · X was half as high as Y.
- Tương phản: In stark contrast · Conversely · While X increased, Y followed an opposite trend · bucking the trend.
- Số liệu: the figure for… · the volume of… · the magnitude of… · the expenditure on… · “chiếm”: constitute / comprise / represent / make up.
- Xấp xỉ: virtually / practically · a mere minority (dưới 5%) · the overwhelming majority (trên 80%) · just shy of / just under · in the vicinity of.
## 7 ví dụ trong sách (tr.279–305)
|Dạng|Điểm chốt

W5:`## Tiêu chí (tr.306)
- Câu hỏi then chốt: “Khu vực này đã thay đổi thế nào từ thời điểm A đến B?” TA: Overview xu hướng chung (vd nông thôn → thành thị). CC: sắp theo không gian (Bắc–Nam, Đông–Tây) hoặc chức năng. LR: từ quy hoạch, xây dựng, vị trí. GRA: bị động và mệnh đề quan hệ.
## Biến thể và thì (tr.306–308)
- Past → Present: Past Simple cho thứ đã bị phá (The old school was demolished); Present Perfect bị động cho thứ đã xây và đang tồn tại (A new supermarket has been constructed).
- Past → Past: 100% Past Simple; dùng used to be, was located, was replaced by.
- Present → Future: đừng dùng “will” đơn điệu: is projected to be built · is set to be constructed · is planned for · proposes the construction of… (với Future Plans: will be + V3).
- So sánh vị trí (Site S1 vs S2): xét Accessibility, Proximity, Environment; dùng điều kiện và so sánh (Site S1 is more convenient for residents as it is closer to…).
## 3 bước (tr.308–310)
- Bước 1 – tọa độ và thời gian: có la bàn thì KHÔNG dùng left/right/top/bottom (Top left → North-West; Bottom right → South-East). “In the North” = bên trong; “To the North” = bên ngoài. Không có la bàn: bản đồ địa lý mặc định cạnh trên là Bắc; floor plan được dùng at the top, to the right of the entrance, in the bottom left-hand corner. Ghi PAST/PRESENT cạnh bản đồ để khóa thì.
- Bước 2 – xu hướng chung. Geo map: Urbanization · Modernization/Industrialization · Tourism Development · Deforestation. Floor plan: Renovation & Reconfiguration · Expansion/Extension · Traffic Flow Optimization.
- Bước 3 – “Gạch bỏ và Thay thế” (tìm điểm khác nhau, quét Tây→Đông hoặc Bắc→Nam): nhóm Vanished features · New Additions · Converted features (cấu trúc giữ nguyên, đổi chức năng).
## Cấu trúc (tr.310–311)
- Intro 1 câu: The maps/diagrams/plans + illustrate/depict/show/detail + the changes/transformation/development/layout of…
- Overview 2 câu: Overall, it is clear that the [village/town] has undergone significant urbanization/modernization… with the most notable changes being the construction of… and the disappearance of…
- Body 1 và 2: chia theo khu vực (khuyên dùng) hoặc theo thời gian; luôn “neo” vị trí (In the north…, To the west of the lake…); nối bằng Looking at the south, Meanwhile, In contrast.
## Từ vựng (tr.311–312)
- Xây: construct / erect / build · develop / establish · expand / extend / widen · lengthen · spring up.
- Phá: demolish / knock down / flatten / raze · cut down / chop down / clear / uproot · disappear / vanish (nội động từ, không bị động).
- Thay thế: replace A with B · convert A into B · transform A into B · make way for / give way to (The farmland was cleared to make way for a new industrial park.)
- Vị trí: adjacent to / next to / adjoining · opposite / facing / across from · running along · parallel to. Khoảng 90% động từ phải ở bị động.
## Lỗi (tr.313)
- Lạc hướng · sai thì · thiếu mạo từ (the north, the river) · liệt kê thay vì liên kết (“cái cây bị chặt để xây ngôi nhà”) · quên nhận xét kích thước.
## Bài mẫu Biology School (tr.314–316)
- Overview 7.0: …will undergo significant expansion, with the addition of new academic and parking facilities at the expense of existing green spaces. However, the central and southeastern areas will remain largely unchanged.
- CC: Looking at the northern section… / Moving to the southwest… / Adjacent to this… · LR: be cleared / constructed / erected / converted into / replaced by / repurposed into / expanded / remain unchanged · GRA: The trees, which are currently located in the southwest, will be replaced by a new car park.`,
W6:`## Yêu cầu (tr.318)
- Chuyển hình thành văn bản theo trật tự thời gian nghiêm ngặt, khách quan (không ý kiến cá nhân), tối thiểu 150 từ, khuyến nghị 20 phút.
## Phân loại (tr.318–319)
- Linear (có Start và End riêng, vd sản xuất xi măng, cacao → chocolate) vs Cyclical (khép kín, vd vòng đời bướm, vòng tuần hoàn nước).

## 4 giai đoạn làm bài (tr.320)
- 1) Phân tích: xác định loại, điểm đầu–cuối, ĐẾM đúng số bước (bỏ sót là mất Task Achievement). 2) Outline: Intro, Overview (số bước + đầu/cuối), chia 2 Body ở logical break point. 3) Viết: sequencers + đa dạng cú pháp. 4) Rà soát: Hiện tại đơn, chủ–vị, đối chiếu với hình.
## Cấu trúc (tr.320–322)
- Intro: The diagram / flow chart / schematic / illustration + illustrates / depicts / demonstrates / outlines / highlights / provides a breakdown of + how… is produced / the stages involved in… / the life cycle of…
- Overview 2 câu: Overall, it is readily apparent that this is a [complex/linear/cyclical] process comprising [số] distinct stages. · The procedure commences with… and culminates in…
- Body 1: nửa đầu quy trình (vd 7 bước thì 3–4 bước đầu, hoặc chia theo địa điểm), mở bằng To begin with,… / The process initiates when… / In the first stage,…
- Body 2: nối bằng Once the [previous stage] is complete,… / Subsequent to this step,… / Following the…; kết: Finally, the finished products are… / The cycle repeats anew when…
## Từ nối và từ vựng (tr.322–323)
- Bắt đầu: The process involves… / The first step is… · Tiếp diễn: Subsequently / Following this / The next stage involves… / Upon completion of this stage… · Đồng thời: Concurrently / Simultaneously / In tandem with this… · Kết thúc: Finally / Eventually / The process ceases when…
- Từ vựng: undergo a transformation / convert into / be processed into · be manufactured / generated / extracted / refined · be transported via conveyor belt / distributed to / delivered · reach maturity / develop into / hatch / molt.
## Lỗi (tr.323–324)
- Sai thì: chỉ dùng Present Simple (The coffee beans are harvested…, không dùng were).
- Chủ quan: ✗ Workers carefully select the best apples to ensure high quality. ✓ The apples are selected by hand.
- Bỏ bước: ✓ Once the clay is dug up, it is crushed and mixed with sand before being molded and fired in a kiln to produce bricks.
- Lặp Then…Then: ✓ After the fruit is washed, it is peeled and subsequently sliced. · Thiếu liên kết: ✓ As the sun shines, water evaporates to form clouds.
## Bài mẫu Landfill (tr.325–327)

W2~Trong Discussion, Body 1 nên viết về phe nào và dùng ngôi nào?~Phe bạn đồng ý, dùng I~Phe bạn KHÔNG đồng ý, khách quan, ngôi 3 (They / Some people)~Cả hai phe cùng lúc~Ví dụ cá nhân bằng I~1~tr.259–261: Body 1 khách quan; Body 2 mới là phe của bạn (save the best for last).

W3~“One paragraph, one purpose” trong Two-part nghĩa là gì?~Mỗi đoạn dài một câu~Mỗi Body trả lời trọn vẹn một câu hỏi~Chỉ viết một đoạn~Không dùng ví dụ~1~Không gộp hai câu trả lời vào một đoạn.
W3~“Turning to the second question,…” dùng để làm gì?~Signposting: chuyển sang Body 2~Kết luận bài~Mở bài~Dẫn ví dụ~0~Signposting giúp giám khảo thấy bạn trả lời đủ cả hai câu hỏi.

W4~Overview của line graph có chứa số liệu cụ thể không?~Có, càng nhiều càng tốt~Không, chỉ nêu 2–3 đặc điểm bao quát~Chỉ số đầu~Chỉ số cuối~1~Số liệu để dành cho Body.
W4~Dạng biểu đồ nào luôn là time series?~Pie chart~Line graph~Table~Bar chart~1~Line graph luôn có trục thời gian.
W5~Bản đồ có la bàn thì nên tránh nhóm từ nào để chỉ vị trí?~North / South~left / right / top / bottom~adjacent to~next to~1~Top left → North-West; Bottom right → South-East.

else if(g.dataset.tm){clearInterval(tm);left=T[g.dataset.tm][1];$("clk").textContent=fmt(left);tm=setInterval(()=>{left--;$("clk").textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(tm);$("clk").textContent="Hết giờ!"}},1000)}
else if(g.dataset.stop){clearInterval(tm)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.ck){S.done[t.dataset.ck]=t.checked?1:0;save();head()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.nt){S.notes[t.dataset.nt]=t.value;save()}
if(t.id==="raw"||t.id==="bk"){const r=parseInt($("raw").value);$("bd").textContent=isNaN(r)?"–":bandOf($("bk").value==="L"?BL:BR,r)}});
/* ===== Sổ từ vựng ===== */
const VF=[["word","Từ"],["ipa","Phiên âm"],["pos","Loại từ"],["vi","Nghĩa tiếng Việt"],["vd","Nghĩa Việt theo loại từ"],["en","Nghĩa tiếng Anh"],["syn","Đồng nghĩa"],["ex","Ví dụ"],["note","Ghi chú"]];
const vesc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function vocab(){return `<div class="card"><b>📒 Sổ từ vựng</b> <span class="mu" id="vcnt"></span>
<div class="vrow"><input id="vw" placeholder="Từ hoặc cụm từ tiếng Anh…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b on" id="vgo" data-va="add">Tra &amp; lưu</button></div>
<textarea id="vn" placeholder="Ghi chú riêng (tuỳ chọn): gặp ở bài nào, mẹo nhớ…"></textarea><div class="mu" id="vmsg"></div><div style="margin-top:6px"><button class="b" data-va="exp">⬇️ Xuất sao lưu</button> <button class="b" data-va="imp">⬆️ Nhập sao lưu</button><input type="file" id="vimp" accept=".json,application/json" style="display:none"></div></div>
<input id="vq" class="vq" placeholder="Tìm trong sổ (từ, nghĩa, loại từ, ghi chú)…"><div id="vl"></div>`}
function vlist(){const q=(($("vq")||{}).value||"").toLowerCase();
const a=S.vocab.slice().sort((x,y)=>(y.t||0)-(x.t||0)).filter(x=>!q||[x.word,x.pos,x.vi,x.vd,x.en,x.syn,x.note].join(" ").toLowerCase().includes(q));
$("vcnt").textContent="· "+S.vocab.length+" từ";
$("vl").innerHTML=a.length?a.map(x=>`<div class="card" data-vid="${vesc(x.id)}"><div class="vt"><span><b class="vw">${vesc(x.word)}</b> <button class="b vs" data-va="say" title="Nghe phát âm">🔊</button>${x.ipa?`<span class="vph">${vesc(x.ipa)}</span>`:""}${x.pos?`<span class="vp">${vesc(x.pos)}</span>`:""}</span><span><button class="b vs" data-va="re" title="Tra lại">↻</button> <button class="b vs" data-va="edit">Sửa</button> <button class="b vs" data-va="del">Xoá</button></span></div>`+
(x.vi?`<div class="vm">${vesc(x.vi)}</div>`:"")+(x.vd?`<div class="vx">${vesc(x.vd)}</div>`:"")+(x.en?`<div class="vx">${vesc(x.en)}</div>`:"")+
(x.syn?`<div class="vx">Đồng nghĩa: ${vesc(x.syn)}</div>`:"")+(x.ex?`<div class="vx"><i>${vesc(x.ex)}</i></div>`:"")+(x.note?`<div class="vnote">${vesc(x.note)}</div>`:"")+`</div>`).join(""):
`<div class="mu" style="text-align:center;padding:18px 0">${S.vocab.length?"Không có từ nào khớp.":"Chưa có từ nào. Thêm từ đầu tiên ở trên nhé."}</div>`}
async function vlookup(w){const r={word:"",ipa:"",audio:"",pos:"",vi:"",vd:"",en:"",syn:"",ex:"",sa:[],sb:[],ok:false};
const jf=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const x=await fetch(u,{signal:c.signal});if(!x.ok)throw 0;return await x.json()}finally{clearTimeout(t)}};
await Promise.all([
(async()=>{try{const J=await jf("https://api.dictionaryapi.dev/v2/entries/en/"+encodeURIComponent(w)),m=J.flatMap(e=>e.meanings||[]),ph=J.flatMap(e=>e.phonetics||[]);
r.ipa=(J.find(e=>e.phonetic)||{}).phonetic||(ph.find(p=>p.text)||{}).text||"";r.audio=(ph.find(p=>p.audio&&/-us\./.test(p.audio))||ph.find(p=>p.audio)||{}).audio||"";
r.pos=[...new Set(m.map(x=>x.partOfSpeech))].join(" / ");
const ds=m.flatMap(x=>x.definitions);r.en=ds[0].definition;r.ex=(ds.find(d=>d.example)||{}).example||"";
r.sa=[...new Set(m.flatMap(x=>[...(x.synonyms||[]),...x.definitions.flatMap(d=>d.synonyms||[])]))];r.ok=true}catch(e){}})(),
(async()=>{try{const j=await jf("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&dt=bd&q="+encodeURIComponent(w));
r.vi=j[0].map(a=>a[0]).join("");
if(j[1])r.vd=j[1].map(e=>e[0]+": "+e[1].slice(0,4).join(", ")).join(" · ");
if(!r.pos&&j[1])r.pos=j[1].map(e=>e[0]).join(" / ");r.ok=true}catch(e){
try{const j=await jf("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(w));r.vi=j.responseData.translatedText;r.ok=true}catch(e2){}}})(),
(async()=>{try{const j=await jf("https://api.datamuse.com/words?rel_syn="+encodeURIComponent(w)+"&max=6");r.sb=j.map(x=>x.word)}catch(e){}})()]);
r.syn=[...new Set([...r.sa,...r.sb])].slice(0,6).join(", ");
return r}
async function vadd(){const inp=$("vw"),raw=inp.value.trim(),btn=$("vgo"),msg=$("vmsg");if(!raw){msg.textContent="Hãy nhập một từ.";return}
btn.disabled=true;msg.textContent="Đang tra “"+raw+"”…";
const r=await vlookup(raw),id=raw.toLowerCase().replace(/\s+/g," "),old=S.vocab.find(x=>x.id===id)||{};
const it={id,word:old.word||raw,t:Date.now()};
["ipa","audio","pos","vi","vd","en","syn","ex"].forEach(k=>it[k]=r[k]||old[k]||"");
it.note=$("vn").value.trim()||old.note||"";
S.vocab=S.vocab.filter(x=>x.id!==id);S.vocab.unshift(it);save();
inp.value="";$("vn").value="";btn.disabled=false;
msg.textContent=r.ok?"Đã lưu “"+it.word+"”.":"Không tra được tự động (kiểm tra mạng). Từ vẫn được lưu, bấm Sửa để nhập nghĩa.";
vlist();inp.focus()}
function vedit(card,x){card.innerHTML=VF.map(f=>`<div class="mu">${f[1]}</div><textarea data-vf="${f[0]}" style="min-height:34px"></textarea>`).join("")+`<div style="margin-top:6px"><button class="b on" data-va="save">Lưu</button> <button class="b" data-va="cancel">Huỷ</button></div>`;
card.querySelectorAll("[data-vf]").forEach(t=>t.value=x[t.dataset.vf]||"")}
function vsay(x){const tts=()=>{try{const u=new SpeechSynthesisUtterance(x.word);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
if(x.audio){try{new Audio(x.audio).play().catch(tts)}catch(e){tts()}}else tts()}
async function vre(x){const m=$("vmsg");if(m)m.textContent="Đang tra lại “"+x.word+"”…";const r=await vlookup(x.word);
["ipa","audio","pos","vi","vd","en","syn","ex"].forEach(k=>{if(r[k])x[k]=r[k]});save();vlist();
if(m)m.textContent=r.ok?"Đã tra lại “"+x.word+"”.":"Không tra lại được (kiểm tra mạng)."}
document.addEventListener("click",e=>{const g=e.target.closest("[data-va]");if(!g)return;const a=g.dataset.va;
if(a==="add")return vadd();
if(a==="exp"){const bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="ielts-forum-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
if(a==="imp")return $("vimp").click();
const card=g.closest("[data-vid]"),x=card&&S.vocab.find(v=>v.id===card.dataset.vid);if(!x)return;
if(a==="say")vsay(x);
else if(a==="re")vre(x);
else if(a==="edit")vedit(card,x);
else if(a==="cancel")vlist();
else if(a==="del"){if(confirm("Xoá “"+x.word+"” khỏi sổ?")){S.vocab=S.vocab.filter(v=>v!==x);save();vlist()}}
else if(a==="save"){card.querySelectorAll("[data-vf]").forEach(t=>x[t.dataset.vf]=t.value.trim());if(!x.word)x.word=x.id;x.t=Date.now();save();vlist()}});
document.addEventListener("keydown",e=>{if(e.target.id==="vw"&&e.key==="Enter")vadd()});
document.addEventListener("input",e=>{if(e.target.id==="vq")vlist()});
document.addEventListener("change",e=>{if(e.target.id!=="vimp"||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result),ids=new Set(S.vocab.map(x=>x.id));(o.vocab||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id))S.vocab.push(x)});S.done=Object.assign({},o.done||{},S.done);S.notes=Object.assign({},o.notes||{},S.notes);save();vlist();$("vmsg").textContent="Đã nhập sao lưu."}catch(err){$("vmsg").textContent="File sao lưu không hợp lệ."}};fr.readAsText(e.target.files[0])});
draw();
</script></body></html>
